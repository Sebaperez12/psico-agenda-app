<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4b5bff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7ac7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)"/>
  
  <!-- Calendar grid (left side) -->
  <g fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9">
    <!-- Calendar outline -->
    <rect x="40" y="50" width="50" height="50" rx="3"/>
    <!-- Calendar lines -->
    <line x1="40" y1="65" x2="90" y2="65"/>
    <line x1="45" y1="75" x2="85" y2="75"/>
    <line x1="45" y1="85" x2="85" y2="85"/>
  </g>
  
  <!-- Heart/care symbol (right side) -->
  <g fill="#ffffff" opacity="0.95">
    <!-- Heart shape representing care -->
    <path d="M 130 70 C 130 65 126 60 120 60 C 115 60 112 63 110 67 C 108 63 105 60 100 60 C 94 60 90 65 90 70 C 90 80 100 88 110 97 C 120 88 130 80 130 70 Z" />
  </g>
  
  <!-- Checkmark (appointment done) -->
  <g stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round">
    <polyline points="105,110 115,120 135,100"/>
  </g>
  
  <!-- Subtle inner circle accent -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
</svg>