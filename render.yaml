services:
  - type: web
    runtime: python
    name: psico-agenda-api
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: APP_TIMEZONE
        value: America/Montevideo
      - key: DATABASE_URL
        fromDatabase:
          name: psico-agenda-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: REMINDER_JOB_KEY
        generateValue: true
      - key: BACKEND_BASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: MAIL_SERVER
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "True"
      - key: MAIL_TIMEOUT
        value: "10"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false

databases:
  - name: psico-agenda-db
    plan: free
